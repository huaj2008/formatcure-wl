<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <title>FormatCure WL Functions</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
</head>
<body>
    <script type="text/javascript">
        // ============================================
        // FORMATCURE WL - RIBBON BUTTON FUNCTIONS
        // Build #81
        // ============================================

        // Pharmaceutical acronyms to preserve (synced with taskpane.html)
        const PRESERVED_TERMS = [
            'FDA', 'IND', 'NDA', 'BLA', 'ANDA', 'DMF', 'CTD', 'eCTD',
            'PK', 'PD', 'ADME', 'AUC', 'Cmax', 'Tmax',
            'API', 'GMP', 'cGMP', 'GLP', 'ICH', 'QbD', 'PAT', 'CPP', 'CQA', 'QTPP',
            'DNA', 'RNA', 'mRNA', 'pH', 'UV', 'IR', 'NMR', 'HPLC', 'GC', 'MS',
            'IV', 'IM', 'SC', 'PO', 'QD', 'BID', 'TID', 'QID', 'PRN',
            'US', 'EU', 'UK', 'WHO', 'EMA', 'PMDA', 'TGA', 'NMPA',
            'SOP', 'QA', 'QC', 'R&D', 'CMC', 'CMO', 'CRO', 'CDMO',
            'DS', 'DP', 'ADC', 'SD', 'PBMC', 'Aleeto'
        ];

        const LOWERCASE_WORDS = [
            'a', 'an', 'the', 'at', 'by', 'for', 'in', 'of', 'on', 'to', 'up',
            'and', 'as', 'but', 'or', 'nor', 'so', 'yet', 'be'
        ];

        // Initialize Office
        Office.onReady(function(info) {
            if (info.host === Office.HostType.Word) {
                Office.actions.associate("applyTitleCase", applyTitleCase);
                Office.actions.associate("applySentenceCase", applySentenceCase);
                Office.actions.associate("applyBodyFormat", applyBodyFormat);
                Office.actions.associate("applyCrossRefStyle", applyCrossRefStyle);
                Office.actions.associate("applyEctdLinkStyle", applyEctdLinkStyle);
            }
        });

        // ============================================
        // TITLE CASE
        // Removes allCaps first, then converts to Title Case
        // ============================================
        async function applyTitleCase(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    
                    // Remove All Caps formatting first
                    selection.font.allCaps = false;
                    await context.sync();
                    
                    selection.load("text");
                    await context.sync();

                    let text = selection.text;
                    let target = selection;

                    if (!text || text.trim() === "") {
                        const paras = selection.paragraphs;
                        paras.load("items");
                        await context.sync();
                        if (paras.items.length > 0) {
                            paras.items[0].font.allCaps = false;
                            await context.sync();
                            target = paras.items[0].getRange();
                            target.load("text");
                            await context.sync();
                            text = target.text;
                            if (text.endsWith('\r')) text = text.slice(0, -1);
                        }
                    } else {
                        if (text.endsWith('\r')) text = text.slice(0, -1);
                    }

                    if (text && text.trim()) {
                        target.insertText(convertToTitleCase(text), Word.InsertLocation.replace);
                        await context.sync();
                    }
                });
            } catch (e) { console.error(e); }
            event.completed();
        }

        // ============================================
        // SENTENCE CASE
        // Removes allCaps first, then converts to Sentence Case
        // ============================================
        async function applySentenceCase(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    
                    // Remove All Caps formatting first
                    selection.font.allCaps = false;
                    await context.sync();
                    
                    selection.load("text");
                    await context.sync();

                    let text = selection.text;
                    let target = selection;

                    if (!text || text.trim() === "") {
                        const paras = selection.paragraphs;
                        paras.load("items");
                        await context.sync();
                        if (paras.items.length > 0) {
                            paras.items[0].font.allCaps = false;
                            await context.sync();
                            target = paras.items[0].getRange();
                            target.load("text");
                            await context.sync();
                            text = target.text;
                            if (text.endsWith('\r')) text = text.slice(0, -1);
                        }
                    } else {
                        if (text.endsWith('\r')) text = text.slice(0, -1);
                    }

                    if (text && text.trim()) {
                        target.insertText(convertToSentenceCase(text), Word.InsertLocation.replace);
                        await context.sync();
                    }
                });
            } catch (e) { console.error(e); }
            event.completed();
        }

        // ============================================
        // BODY FORMAT
        // TNR 12pt, 1.15 spacing, 6pt before/after
        // Keeps bold/italic/underline/color (no text change)
        // Skips: headings, TOC, tables, captions
        // ============================================
        async function applyBodyFormat(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    const paras = selection.paragraphs;
                    paras.load("items");
                    await context.sync();

                    // Load style and text for all paragraphs first
                    for (let i = 0; i < paras.items.length; i++) {
                        paras.items[i].load("style, text, parentTableOrNullObject");
                    }
                    await context.sync();

                    for (let i = 0; i < paras.items.length; i++) {
                        const para = paras.items[i];
                        const styleName = (para.style || "").toLowerCase();
                        const text = (para.text || "").trim().toLowerCase();
                        
                        // Skip if inside a table
                        if (para.parentTableOrNullObject && !para.parentTableOrNullObject.isNullObject) {
                            continue;
                        }
                        
                        // Skip headings (H1-H10, TOC Heading), Title
                        if (styleName.includes('heading') || styleName.includes('toc') || styleName === 'title') {
                            continue;
                        }
                        
                        // Skip TOC/LOT/LOF entries (TOC 1, TOC 2, etc.)
                        if (styleName.match(/^toc\s*\d/) || styleName.includes('table of')) {
                            continue;
                        }
                        
                        // Skip TOC/LOT/LOF titles by content
                        if (text === 'table of contents' || text === 'list of tables' || 
                            text === 'list of figures' || text === 'contents' ||
                            text === 'toc' || text === 'lot' || text === 'lof') {
                            continue;
                        }
                        
                        // Skip captions
                        if (/^(table|figure)\s*[\d\.]/i.test(text)) {
                            continue;
                        }
                        
                        // Apply formatting only — no text/case changes
                        // Keeps bold, italic, underline, color as-is
                        para.font.name = "Times New Roman";
                        para.font.size = 12;
                        para.lineSpacing = 13.8; // 1.15 spacing
                        para.lineUnitAfter = 0;
                        para.lineUnitBefore = 0;
                        para.spaceBefore = 6;
                        para.spaceAfter = 6;
                        para.alignment = Word.Alignment.left;
                    }
                    await context.sync();
                });
            } catch (e) { console.error(e); }
            event.completed();
        }

        // ============================================
        // CROSS-REF STYLE
        // Blue, Bold, NO underline, NOT italic
        // Does NOT change font/size (preserves 10pt in tables, 12pt in body)
        // ============================================
        async function applyCrossRefStyle(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.font.bold = true;
                    selection.font.italic = false;
                    selection.font.underline = Word.UnderlineType.none;
                    selection.font.color = "#0000FF";
                    await context.sync();
                });
            } catch (e) { console.error(e); }
            event.completed();
        }

        // ============================================
        // eCTD LINK STYLE
        // Blue only, NOT underlined, NOT bold
        // Does NOT change font/size (preserves 10pt in tables, 12pt in body)
        // ============================================
        async function applyEctdLinkStyle(event) {
            try {
                await Word.run(async (context) => {
                    const selection = context.document.getSelection();
                    selection.font.bold = false;
                    selection.font.underline = Word.UnderlineType.none;
                    selection.font.color = "#0000FF";
                    await context.sync();
                });
            } catch (e) { console.error(e); }
            event.completed();
        }

        // ============================================
        // CONVERSION FUNCTIONS (synced with taskpane.html)
        // ============================================
        function convertToTitleCase(text) {
            const preservedMap = {};
            PRESERVED_TERMS.forEach(t => preservedMap[t.toLowerCase()] = t);

            const words = text.split(/(\s+)/);
            const result = [];
            let idx = 0;
            const total = words.filter(w => w.trim()).length;

            for (const seg of words) {
                if (!seg.trim()) { result.push(seg); continue; }
                idx++;
                const lower = seg.toLowerCase();
                const isFirst = idx === 1, isLast = idx === total;

                if (preservedMap[lower]) result.push(preservedMap[lower]);
                else if (/^[A-Z]{2,10}$/.test(seg)) result.push(seg);
                else if (!isFirst && !isLast && LOWERCASE_WORDS.includes(lower)) result.push(lower);
                else result.push(seg.charAt(0).toUpperCase() + seg.slice(1).toLowerCase());
            }
            return result.join('');
        }

        function convertToSentenceCase(text) {
            const preservedMap = {};
            PRESERVED_TERMS.forEach(t => preservedMap[t.toLowerCase()] = t);

            const sentences = text.split(/([.!?]+\s*)/);
            const result = [];

            for (const sent of sentences) {
                if (/^[.!?]+\s*$/.test(sent)) { result.push(sent); continue; }
                
                const words = sent.split(/(\s+)/);
                const processed = [];
                let isFirst = true;

                for (const w of words) {
                    if (!w.trim()) { processed.push(w); continue; }
                    const lower = w.toLowerCase();

                    if (preservedMap[lower]) processed.push(preservedMap[lower]);
                    else if (/^[A-Z]{2,10}$/.test(w)) processed.push(w);
                    else if (isFirst) processed.push(w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
                    else processed.push(lower);
                    isFirst = false;
                }
                result.push(processed.join(''));
            }
            return result.join('');
        }
    </script>
</body>
</html>
